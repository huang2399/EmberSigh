name: Deploy EmberSigh Site

# 只在「网页版」目录或本工作流本身变化时触发，避免固件代码提交也触发部署
on:
  push:
    branches: [main]
    paths:
      - '网页版/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 构建与上传分离：避免同 job 内 artifact 尚未在 API 注册就触发 deploy（曾导致 "No artifacts named github-pages"）
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site root
        run: cp "网页版/index(1).html" "网页版/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 网页版

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
