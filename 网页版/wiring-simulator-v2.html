<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmberSigh 连线模拟器 · 傻瓜版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:#ddd;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#tipBar{background:#1a1a1a;border-bottom:1px solid #333;padding:6px 16px;font-size:.8rem;color:#888;text-align:center;flex-shrink:0}
#tipBar b{color:#58a6ff}
#mainArea{display:flex;flex:1;overflow:hidden}
#canvasWrap{flex:1;position:relative;overflow:hidden;cursor:grab;background:#121212}
#canvasWrap:active{cursor:grabbing}
#canvasWrap svg{display:block;width:100%;height:100%}
/* Toolbar */
#toolbar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:20}
#toolbar button{padding:6px 14px;border:1px solid #444;border-radius:6px;background:#1a1a1a;color:#ccc;cursor:pointer;font-size:.75rem;white-space:nowrap}
#toolbar button:hover{background:#252525;border-color:#58a6ff}
#toolbar .danger:hover{background:#3b0000;border-color:#f44}
/* Log panel */
#logPanel{width:240px;background:#1a1a1a;border-left:1px solid #333;display:flex;flex-direction:column;flex-shrink:0}
#logPanel h3{font-size:.78rem;padding:8px 12px;border-bottom:1px solid #333;color:#58a6ff;margin:0;background:#151515}
#logList{flex:1;overflow-y:auto;padding:6px 10px;font-size:.7rem;font-family:'Cascadia Code',Consolas,monospace;line-height:1.6}
#logList div{padding:3px 0;border-bottom:1px solid #222}
#logList .ok{color:#3fb950}
#logList .err{color:#f85149}
#logList .warn{color:#d2991d}
/* Bubble */
#bubble{position:fixed;pointer-events:none;background:#1a1a1a;border:1px solid #f85149;border-radius:8px;padding:8px 14px;font-size:.78rem;color:#f85149;z-index:999;opacity:0;transform:translate(-50%,-120%);transition:opacity .2s;max-width:280px;text-align:center;box-shadow:0 4px 20px rgba(255,0,0,.15);white-space:pre-line}
#bubble.show{opacity:1}
#bubble.ok{border-color:#3fb950;color:#3fb950;box-shadow:0 4px 20px rgba(0,255,0,.1)}
/* Check overlay */
#checkOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:998;display:none;align-items:center;justify-content:center;flex-direction:column}
#checkOverlay.show{display:flex}
#checkOverlay .box{background:#1a1a1a;border:2px solid #3fb950;border-radius:16px;padding:30px 44px;text-align:center;max-width:480px}
#checkOverlay .box.bad{border-color:#f85149}
#checkOverlay .icon{font-size:3.5rem}
#checkOverlay h2{font-size:1.3rem;margin:8px 0 4px}
#checkOverlay p{font-size:.78rem;color:#888;line-height:1.6;white-space:pre-line}
#checkOverlay p b{color:#fbbf24}
#checkOverlay button{margin-top:14px;padding:7px 28px;border:1px solid #444;border-radius:6px;background:#21262d;color:#ccc;cursor:pointer;font-size:.8rem}
.pin{cursor:pointer;transition:r .12s}
.pin:hover{filter:url(#g)}
.pin.selected{filter:url(#g);stroke:#fff;stroke-width:2.5}
.pin.hint{filter:url(#g);animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#wireCount{background:#1a1a1a;padding:4px 12px;border-radius:10px;font-size:.75rem;color:#888;border:1px solid #333}
</style>
</head>
<body>

<!-- 检查结果弹窗 -->

<script>
// ═══════ 状态 ═══════
const wires = [];
let selectedPin = null;
let scale = 0.55, tx = 30, ty = 40;
let isDragging = false, dragStart = { x: 0, y: 0 };
let svg, world, wiresGroup;

// ═══ 引脚坐标与元数据 ═══
const pins = {
  'pin-io1':  {cx:30,cy:400,l:'IO1',c:'ESP32',clr:'#fbbf24',role:'控制信号（接MOS管SIG）'},
  'pin-io16': {cx:30,cy:455,l:'IO16',c:'ESP32',clr:'#22c55e',role:'灯环数据（接WS2812 DIN）'},
  'pin-gnd':  {cx:30,cy:510,l:'GND',c:'ESP32',clr:'#888',role:'接地（接面包板负极）'},
  'pin-io14': {cx:330,cy:375,l:'IO14',c:'ESP32',clr:'#f97316',role:'音频数据（接功放DIN）'},
  'pin-io17': {cx:330,cy:430,l:'IO17',c:'ESP32',clr:'#3b82f6',role:'左右声道时钟（接功放LRC）'},
  'pin-io18': {cx:330,cy:485,l:'IO18',c:'ESP32',clr:'#a855f7',role:'位时钟信号（接功放BCLK）'},
  'pin-bb-plus':  {cx:408,cy:260,l:'面包板正极',c:'面包板',clr:'#ef4444',role:'电源正极总线'},
  'pin-bb-minus': {cx:408,cy:310,l:'面包板负极',c:'面包板',clr:'#6e7681',role:'电源负极/接地总线'},
  'pin-max-vin':  {cx:830,cy:160,l:'VIN',c:'功放',clr:'#ef4444',role:'功放电源正极'},
  'pin-max-gnd':  {cx:895,cy:160,l:'GND',c:'功放',clr:'#888',role:'功放接地'},
  'pin-max-bclk': {cx:960,cy:160,l:'BCLK',c:'功放',clr:'#a855f7',role:'位时钟输入'},
  'pin-max-lrc':  {cx:830,cy:210,l:'LRC',c:'功放',clr:'#3b82f6',role:'左右通道时钟'},
  'pin-max-din':  {cx:895,cy:210,l:'DIN',c:'功放',clr:'#f97316',role:'音频数据输入'},
  'pin-mos-sig':  {cx:830,cy:360,l:'SIG',c:'MOS管',clr:'#fbbf24',role:'开关信号输入'},
  'pin-mos-dc-plus': {cx:895,cy:360,l:'DC+',c:'MOS管',clr:'#ef4444',role:'MOS管供电正极'},
  'pin-mos-dc-minus':{cx:960,cy:360,l:'DC-',c:'MOS管',clr:'#888',role:'MOS管供电负极'},
  'pin-mos-out-plus': {cx:840,cy:415,l:'OUT+',c:'MOS管',clr:'#f97316',role:'输出正极（接加湿器+）'},
  'pin-mos-out-minus':{cx:920,cy:415,l:'OUT-',c:'MOS管',clr:'#888',role:'输出负极（接加湿器-）'},
  'pin-led-vcc': {cx:830,cy:535,l:'VCC',c:'灯环',clr:'#ef4444',role:'灯环5V供电'},
  'pin-led-gnd': {cx:895,cy:535,l:'GND',c:'灯环',clr:'#888',role:'灯环接地'},
  'pin-led-din': {cx:960,cy:535,l:'DIN',c:'灯环',clr:'#22c55e',role:'灯环数据输入'},
  'pin-bank-5v':{cx:1125,cy:130,l:'5V输出',c:'充电宝',clr:'#ef4444',role:'5V电源输出'},
  'pin-usb-5v': {cx:1085,cy:225,l:'红5V',c:'USB杜邦线',clr:'#ef4444',role:'USB正极线'},
  'pin-usb-gnd':{cx:1125,cy:225,l:'黑GND',c:'USB杜邦线',clr:'#888',role:'USB负极线'},
  'pin-humid-plus':{cx:1125,cy:352,l:'正极+',c:'加湿器',clr:'#ef4444',role:'加湿器电源正极'},
};

// ═══ 正确连接关系 ═══
const correctMap = {
  'pin-io18': ['pin-max-bclk'],
  'pin-io17': ['pin-max-lrc'],
  'pin-io14': ['pin-max-din'],
  'pin-io1':  ['pin-mos-sig'],
  'pin-io16': ['pin-led-din'],
  'pin-gnd':  ['pin-bb-minus'],
  'pin-bb-plus':  ['pin-max-vin','pin-led-vcc','pin-mos-dc-plus'],
  'pin-bb-minus': ['pin-max-gnd','pin-led-gnd','pin-mos-dc-minus'],
  'pin-mos-out-plus': ['pin-humid-plus'],
  'pin-bank-5v': ['pin-bb-plus','pin-usb-5v'],
  'pin-usb-5v': ['pin-bb-plus'],
};

// ═══ 提示信息 ═══
const roleHints = {
  'pin-max-bclk': 'IO18 是位时钟信号，要连到功放的 BCLK 哦～',
  'pin-max-lrc': 'IO17 是左右声道切换信号，要连到功放的 LRC 哦～',
  'pin-max-din': 'IO14 负责发送音频数据，要连到功放的 DIN 哦～',
  'pin-max-vin': 'VIN 是电源脚，接面包板红色正极（+）供电',
  'pin-max-gnd': 'GND 是接地脚，接面包板蓝色负极（−）',
  'pin-mos-sig': 'IO1 是控制信号，要连到 MOS 管的 SIG 脚哦～',
  'pin-led-din': 'IO16 专门控制灯环颜色，要连到灯环的 DIN 脚哦～',
};

// ═══ 初始化 ═══
function init() {
  svg = document.getElementById('svgRoot');
  world = document.getElementById('world');
  wiresGroup = document.getElementById('wiresGroup');
  applyTransform();

  document.querySelectorAll('.pin').forEach(c => {
    c.addEventListener('click', e => onPin(c.id, e));
  });

  const wrap = document.getElementById('canvasWrap');
  wrap.addEventListener('wheel', onWheel, { passive: false });
  wrap.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

// ═══ 引脚点击 ═══
function onPin(id, e) {
  e.stopPropagation();
  hideBubble();

  if (!selectedPin) {
    selectedPin = id;
    document.getElementById(id).classList.add('selected');
    showHints(id);
  } else if (selectedPin === id) {
    document.getElementById(id).classList.remove('selected');
    selectedPin = null;
    clearHints();
  } else {
    tryConnect(selectedPin, id);
    document.getElementById(selectedPin).classList.remove('selected');
    selectedPin = null;
    clearHints();
  }
}

function showHints(srcId) {
  clearHints();
  const targets = correctMap[srcId];
  if (targets) {
    targets.forEach(tid => {
      const el = document.getElementById(tid);
      if (el) el.classList.add('hint');
    });
  }
}

function clearHints() {
  document.querySelectorAll('.pin.hint').forEach(el => el.classList.remove('hint'));
}

function tryConnect(a, b) {
  const targets = correctMap[a] || [];
  const isOk = targets.includes(b);
  // 也允许反向
  const targetsB = correctMap[b] || [];
  const isOkB = targetsB.includes(a);

  if (isOk || isOkB) {
    const src = isOk ? a : b, dst = isOk ? b : a;
    addWire(src, dst);
  } else {
    // 错误提示
    const p = pins[b];
    const hint = roleHints[b];
    let msg;
    if (hint) {
      msg = hint;
    } else if (p && p.c === '功放' && p.l === 'VIN') {
      msg = '错啦！IO18 是时钟信号，不能连到 VIN 电源上哦！\n信号线要接 BCLK / LRC / DIN';
    } else if (p && p.l.includes('VIN') || p.l.includes('VCC') || p.l.includes('DC+')) {
      msg = `错啦！${pins[a]?.l||a} 是信号线，不能接到${p.l}电源脚！\n电源要从面包板的红色正极（+）拉线哦`;
    } else if (p && p.l.includes('GND') || p.l.includes('DC-')) {
      msg = `错啦！${pins[a]?.l||a} 是信号线，不能接到接地脚！\n接地要统一接面包板蓝色负极（−）`;
    } else {
      msg = '这两根线不该连在一起哦～\n试试看连线正确的那一边？';
    }
    showBubble(b, msg, false);
  }
}

function addWire(fromId, toId) {
  const dup = wires.find(w => (w.from===fromId&&w.to===toId)||(w.from===toId&&w.to===fromId));
  if (dup) { log('warn', `这根线已经连过了：${label(fromId)} ⇄ ${label(toId)}`); return; }

  const w = { from: fromId, to: toId, color: pins[fromId].clr };
  wires.push(w);
  drawWire(w);

  const fromP = pins[fromId], toP = pins[toId];
  log('ok', `${fromP.c} ${fromP.l} → ${toP.c} ${toP.l}，线颜色：${fromP.clr}`);
  updateCount();
}

function drawWire(w) {
  const a = pins[w.from], b = pins[w.to];
  const dx = b.cx - a.cx, cp = Math.min(Math.abs(dx)*.45, 90);
  const d = `M${a.cx} ${a.cy} C${a.cx+cp} ${a.cy}, ${b.cx-cp} ${b.cy}, ${b.cx} ${b.cy}`;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', w.color);
  p.setAttribute('stroke-width', '2.8');
  p.setAttribute('stroke-linecap', 'round');
  p.dataset.f = w.from; p.dataset.t = w.to;
  p.style.cursor = 'pointer';
  p.addEventListener('dblclick', e => { e.stopPropagation(); delWire(w.from, w.to); });
  wiresGroup.appendChild(p);
}

function delWire(a, b) {
  const i = wires.findIndex(w => (w.from===a&&w.to===b)||(w.from===b&&w.to===a));
  if (i < 0) return;
  const w = wires[i]; wires.splice(i,1);
  wiresGroup.querySelectorAll('path').forEach(p => {
    if ((p.dataset.f===w.from&&p.dataset.t===w.to)||(p.dataset.f===w.to&&p.dataset.t===w.from)) p.remove();
  });
  log('warn', `已删除：${label(w.from)} ⇄ ${label(w.to)}`);
  updateCount();
}

function undoWire() { if (wires.length) { const w = wires[wires.length-1]; delWire(w.from, w.to); } }
function clearWires() { while (wires.length) delWire(wires[0].from, wires[0].to); }

function label(id) { const p = pins[id]; return p ? p.c+'·'+p.l : id; }

// ═══ 气泡 ═══
function showBubble(pinId, msg, isOk) {
  const el = document.getElementById(pinId);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const b = document.getElementById('bubble');
  b.textContent = msg;
  b.className = isOk ? 'ok' : '';
  b.style.left = (r.left + r.width/2) + 'px';
  b.style.top = (r.top - 12) + 'px';
  b.classList.add('show');
  clearTimeout(b._t);
  b._t = setTimeout(hideBubble, 3500);
}
function hideBubble() {
  const b = document.getElementById('bubble');
  b.classList.remove('show','ok');
}

// ═══ 检查 ═══
function checkAll() {
  const existing = new Set();
  wires.forEach(w => { existing.add(w.from+'::'+w.to); existing.add(w.to+'::'+w.from); });

  let missing = [], wrongs = [];
  for (const [src, tgts] of Object.entries(correctMap)) {
    for (const t of tgts) {
      if (!existing.has(src+'::'+t) && !existing.has(t+'::'+src)) {
        missing.push(`${pins[src].l} → ${pins[t].l}`);
      }
    }
  }
  wires.forEach(w => {
    const ok = correctMap[w.from]?.includes(w.to) || correctMap[w.to]?.includes(w.from);
    if (!ok) wrongs.push(`${label(w.from)} → ${label(w.to)}`);
  });

  const ov = document.getElementById('checkOverlay');
  const box = document.getElementById('checkBox');
  const icon = document.getElementById('checkIcon');
  const title = document.getElementById('checkTitle');
  const msg = document.getElementById('checkMsg');

  ov.classList.add('show');
  if (!wrongs.length && !missing.length) {
    box.className = 'box'; icon.textContent = '🎉';
    title.textContent = '全部接对了！可以通电！';
    msg.textContent = '所有信号线和电源线都连到了正确的位置，\n插上 USB 开机试试吧～';
  } else if (!wrongs.length && missing.length <= 4) {
    box.className = 'box'; icon.textContent = '👍';
    title.textContent = '基本正确，还差几根';
    msg.textContent = '还没连的线：\n' + missing.map(m => '▸ ' + m).join('\n');
  } else {
    box.className = 'box bad'; icon.textContent = '❌';
    title.textContent = '有些线接错了';
    let t = '';
    if (wrongs.length) t += '🔴 接错的线：\n' + wrongs.map(w => '▸ ' + w).join('\n') + '\n\n';
    if (missing.length) t += '🟡 还没连的：\n' + missing.map(m => '▸ ' + m).join('\n');
    msg.textContent = t || '来连几根线试试？';
  }
}

// ═══ 日志 ═══
function log(type, msg) {
  const list = document.getElementById('logList');
  if (list.children[0]?.textContent === '还没有连线哦～') list.innerHTML = '';
  const d = document.createElement('div');
  d.className = type;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  list.appendChild(d);
  list.scrollTop = list.scrollHeight;
}
function updateCount() {
  document.getElementById('wireCount').textContent = '已连: ' + wires.length + ' 条';
}

// ═══ 缩放平移 ═══
function onWheel(e) {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.08 : 0.92;
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.max(0.15, Math.min(3, scale * f));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}
function onDown(e) {
  if (e.target.classList.contains('pin')) return;
  isDragging = true;
  dragStart = { x: e.clientX - tx, y: e.clientY - ty };
}
function onMove(e) {
  if (!isDragging) return;
  tx = e.clientX - dragStart.x;
  ty = e.clientY - dragStart.y;
  applyTransform();
}
function onUp() { isDragging = false; }
function applyTransform() {
  world.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

init();
</script>
